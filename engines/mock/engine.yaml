engine_id: mock
display_name: Mock (tone generator, no dependencies)
backend_name: mock
backend_version: "1"
protocol_version: 1
venv_python: null

capabilities:
  streaming: true
  pcm_native: true
  voice_clone: false
  custom_voice: true
  voice_design: true
  instruct_control: true
  languages: [Auto, English]

models:
  - alias: mock-tone
    hf_repo: local/mock-tone
    quality_tier: fast
    est_vram_gb: 0.0
    default: true
    mode: clone
  # hf_repo values starting with local/ count as available without a download,
  # so the full custom-voice/design routing surface is testable on CPU.
  - alias: mock-custom
    hf_repo: local/mock-custom
    quality_tier: fast
    est_vram_gb: 0.0
    mode: custom_voice
    supports_instruct: true
    preset_speakers: [Ryan, Serena]
  - alias: mock-design
    hf_repo: local/mock-design
    quality_tier: high
    est_vram_gb: 0.0
    mode: voice_design
    supports_instruct: true
