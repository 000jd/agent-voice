[project]
name = "agent-voice-engine-qwen3-tts"
version = "0.1.0"
description = "Official Qwen3-TTS backend for agent-voice (Apple MPS variant, experimental)"
requires-python = ">=3.11,<3.13"

# Same dependency set as ../../pyproject.toml. The MPS build is the PyPI macOS
# arm64 torch wheel, so there is deliberately no index/source mapping at all.
# Narrowing to the only platform that has MPS keeps the lock honest.
# Proven on uv 0.9.26 in docs/phase0-devices-report.md section 5: torch 2.15.0
# with macosx_14_0_arm64 wheels, 94 packages.
dependencies = [
    "qwen-tts==0.1.1",
    "torch",
    "torchaudio",
    "soundfile",
    "numpy",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.agent-voice]
device = "mps"
