[project]
name = "agent-voice-engine-qwen3-tts-fast"
version = "0.1.0"
description = "CUDA-graph Qwen3-TTS backend for agent-voice"
requires-python = ">=3.11,<3.13"

# faster-qwen3-tts requires transformers>=5.15.1 and installs qwen-tts-hf, a
# compatibility build of the same qwen_tts package with *opposite* pins to
# official qwen-tts. The two distributions must never share an environment.
#
# transformers is pinned exactly. With 5.24.1, qwen_tts's tokenizer crashes on
# load with:
#   AttributeError: property 'upsample' of 'Qwen3TTSTokenizerV2Encoder' has no setter
# because its __init__ assigns `self.upsample = None` while transformers now
# defines `upsample` as a read-only property. 5.15.1 is the version the upstream
# project validated against (see its ROCm notes).
dependencies = [
    "faster-qwen3-tts==0.5.4",
    "transformers==5.15.1",
    "torch>=2.5.1",
    "torchaudio",
    "soundfile",
    "numpy",
]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
