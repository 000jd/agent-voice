engine_id: qwen3_tts_fast
display_name: Qwen3-TTS (CUDA-graph accelerated)
backend_name: faster-qwen3-tts
backend_version: "0.5.4"
protocol_version: 1
venv_python: .venv/bin/python

# Verified on RTX 4060 Ti 16GB / driver 580.178.04 / torch 2.11.0+cu128:
# both talker and predictor CUDA graphs capture and replay, native PCM streaming
# works. transformers MUST be 5.15.1; 5.24.1 breaks qwen_tts's tokenizer load.

capabilities:
  streaming: true
  pcm_native: true
  voice_clone: true
  languages:
    - Auto
    - Chinese
    - English
    - Japanese
    - Korean
    - German
    - French
    - Russian
    - Portuguese
    - Spanish
    - Italian

models:
  - alias: 1.7b-base
    hf_repo: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    quality_tier: high
    est_vram_gb: 4.4
    default: true
  - alias: 0.6b-base
    hf_repo: Qwen/Qwen3-TTS-12Hz-0.6B-Base
    quality_tier: fast
    est_vram_gb: 2.2
