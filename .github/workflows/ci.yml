name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Nothing here needs a secret, and nothing here touches a GPU. The suite runs
# entirely on the CPU against the dependency-free `mock` engine.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    env:
      # The GPU tests skip themselves unless this is explicitly "1". Set it out
      # loud so a stray value in the environment cannot turn them on.
      AGENT_VOICE_RUN_GPU_TESTS: "0"
      PYTHONUNBUFFERED: "1"
      # tests/conftest.py does `from tests._fake_clock import ...` and there is
      # no tests/__init__.py, so the repo root must be importable. pytest's
      # rootdir insertion only covers `python -m pytest`, not the `pytest`
      # console script, hence PYTHONPATH here.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # ffmpeg/ffprobe back the audio pipeline: format conversion (mp3/opus/
      # flac) and duration probing. The mock suite exercises those paths, so a
      # runner without them would fail rather than skip.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      # `--extra dev` matters: ruff, pytest, pytest-asyncio and pytest-timeout
      # live in [project.optional-dependencies].dev. A bare `uv sync` installs
      # none of them, and the lint/test steps would fail on missing commands.
      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -v -m "not gpu"
