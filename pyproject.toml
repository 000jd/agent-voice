[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-voice"
version = "0.2.1"
description = "Headless, UI-free, multi-engine voice cloning and speech synthesis server for AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# CORE DAEMON ONLY. This environment must never install torch.
# Engine dependencies live in engines/<engine_id>/pyproject.toml.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "fastmcp==4.2.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.13",
    "numpy>=1.26",
    "soundfile>=0.12",
    "python-multipart>=0.0.12",
    "nvidia-ml-py>=12.560.30",
    "filelock>=3.16",
    "websockets>=13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.7",
]
demo = [
    # Only the narrated-video example needs Manim; the core daemon and the
    # engine venvs must stay lean.
    "manim>=0.18",
]

[project.scripts]
agent-voice = "agent_voice.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "gpu: requires a real CUDA GPU and downloaded models (skipped by default)",
]
addopts = "-m 'not gpu'"
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
